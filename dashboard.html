<!DOCTYPE html>
<html lang="en">
<head>
    <title>Commission Studio — Reveriel</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;900&family=Open+Sans:wght@400;600&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--ink:#373542;--muted:#7b7782;--coral:#ff7070;--sky:#54d6ff;--navy:#143f80;--paper:#fffdfa;--line:#e7e2e2;--bg:#f5f2ed}
        body{background:var(--bg);color:var(--ink);font-family:'Open Sans',sans-serif}
        button,input,select{font:inherit}.dashboard-page{width:100%;min-height:100vh;padding:clamp(1rem,3vw,2.5rem)}.admin-container{width:min(74rem,100%);margin:0 auto;text-align:left}
        .auth-shell{min-height:calc(100vh - 5rem);display:grid;grid-template-columns:1.1fr .9fr;border-radius:1.5rem;overflow:hidden;background:#fff;box-shadow:0 1.5rem 4rem rgba(42,34,50,.12)}
        .auth-art{position:relative;background:var(--navy) url('gallery/portals.jpg') center/cover no-repeat}.auth-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,50,.02),rgba(12,20,51,.76))}.auth-art-copy{position:absolute;z-index:1;left:clamp(1.5rem,5vw,4rem);right:clamp(1.5rem,5vw,4rem);bottom:clamp(2rem,6vw,5rem);color:#fff}.auth-art h1{margin:0;font:900 clamp(4rem,9vw,8rem)/.8 'Big Shoulders',sans-serif;text-transform:uppercase}.auth-art p{max-width:29rem;font-size:.95rem;line-height:1.7}
        .auth-card{display:flex;flex-direction:column;justify-content:center;padding:clamp(2rem,6vw,5rem);background:var(--paper)}.eyebrow{margin:0 0 .65rem;font:700 .7rem Roboto,sans-serif;letter-spacing:.18rem;text-transform:uppercase;color:var(--coral)}.auth-card h2{margin:0 0 .6rem;font:900 clamp(2.5rem,5vw,4rem)/.95 'Big Shoulders',sans-serif;text-transform:uppercase}.auth-copy{margin:0 0 2rem;color:var(--muted);font-size:.88rem;line-height:1.6}
        .form-group{margin-bottom:1.1rem}.form-label{display:block;margin-bottom:.45rem;font:700 .7rem Roboto,sans-serif;letter-spacing:.11rem;text-transform:uppercase}.form-input,.control-select{width:100%;padding:.78rem .9rem;border:1px solid var(--line);border-radius:.65rem;background:#fff;color:var(--ink);outline:0}.form-input:focus,.control-select:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(84,214,255,.14)}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.76rem 1rem;border:1px solid var(--line);border-radius:.65rem;background:#fff;color:var(--ink);cursor:pointer;font:700 .7rem Roboto,sans-serif;letter-spacing:.09rem;text-transform:uppercase;transition:.2s ease}.btn:hover{border-color:var(--sky);color:var(--navy);transform:translateY(-1px)}.btn.primary{width:100%;border-color:var(--coral);background:var(--coral);color:#fff;box-shadow:0 .5rem 1.2rem rgba(255,112,112,.22)}.btn:disabled{opacity:.55;cursor:wait;transform:none}#auth-error{margin-top:.8rem;color:#aa3030;font-size:.82rem;text-align:center}
        #dashboard-view{display:none}.dashboard-header{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:2rem}.dashboard-header h1{margin:0;font:900 clamp(3rem,7vw,5.5rem)/.85 'Big Shoulders',sans-serif;text-transform:uppercase}.header-actions{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}.stat-card{position:relative;overflow:hidden;padding:1.2rem 1.25rem;border:1px solid var(--line);border-radius:1rem;background:var(--paper);cursor:pointer;transition:.2s ease}.stat-card:hover,.stat-card.is-selected{transform:translateY(-2px);border-color:var(--stat-color,var(--sky));box-shadow:0 .7rem 1.6rem rgba(43,35,52,.08)}.stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.3rem;background:var(--stat-color,var(--sky))}.stat-label{display:block;color:var(--muted);font:700 .68rem Roboto,sans-serif;letter-spacing:.1rem;text-transform:uppercase}.stat-value{display:block;margin-top:.25rem;font:900 2.3rem/1 'Big Shoulders',sans-serif}.stat-new{--stat-color:var(--coral)}.stat-active{--stat-color:var(--sky)}.stat-completed{--stat-color:#58b887}.stat-all{--stat-color:var(--navy)}
        .toolbar{display:grid;grid-template-columns:minmax(12rem,1fr) 11rem 11rem;gap:.75rem;align-items:stretch;margin-bottom:1rem;padding:1rem;border:1px solid var(--line);border-radius:1rem;background:var(--paper)}.toolbar>.control-select,.search-wrap .form-input{min-height:3.35rem}.search-wrap{position:relative;display:block;min-width:0}.search-wrap::before{content:'';position:absolute;z-index:1;left:.92rem;top:50%;width:.62rem;height:.62rem;border:1.5px solid var(--muted);border-radius:50%;transform:translateY(-62%);pointer-events:none}.search-wrap::after{content:'';position:absolute;z-index:1;left:1.48rem;top:calc(50% + .2rem);width:.38rem;height:1.5px;background:var(--muted);transform:rotate(45deg);transform-origin:left center;pointer-events:none}.search-wrap .form-input{display:block;height:100%;margin:0;padding-left:2.3rem}.results-count{margin:0 0 1rem;color:var(--muted);font-size:.78rem}
        .requests-list{display:grid;gap:1rem}.request-card{overflow:hidden;border:1px solid var(--line);border-radius:1rem;background:var(--paper);transition:.2s ease}.request-card:hover{border-color:#d4ccd1;box-shadow:0 .7rem 1.8rem rgba(42,34,50,.06)}.request-summary{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:1rem;align-items:center;padding:1.25rem;border:0;background:transparent;text-align:left;cursor:pointer}.request-summary:focus-visible{outline:3px solid rgba(84,214,255,.45);outline-offset:-3px}.request-title{font:900 1.35rem/1.15 'Big Shoulders',sans-serif;text-transform:uppercase;color:var(--ink)}.request-meta{margin-top:.3rem;color:var(--muted);font-size:.76rem}.summary-size{color:var(--muted);font-size:.8rem}.chevron{width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;background:#f4f0ef;color:var(--ink);transition:.2s ease}.request-card.is-open .chevron{transform:rotate(180deg);background:#fff0ed;color:var(--coral)}
        .status-select{position:relative;z-index:2;padding:.52rem 1.8rem .52rem .7rem;border:1px solid var(--line);border-radius:2rem;background:#fff;color:var(--ink);font:700 .66rem Roboto,sans-serif;text-transform:uppercase;letter-spacing:.06rem;cursor:pointer}.status-select[data-status="New"]{border-color:#ffc1b8;background:#fff2ee}.status-select[data-status="In Progress"]{border-color:#9ee8ff;background:#eefbff}.status-select[data-status="Accepted"]{border-color:#bab5ee;background:#f4f2ff}.status-select[data-status="Completed"]{border-color:#a9dec3;background:#effaf4}.status-select[data-status="Declined"]{background:#f2f0f0;color:#777}
        .request-body{display:none;padding:0 1.25rem 1.4rem;border-top:1px solid var(--line)}.request-card.is-open .request-body{display:block;animation:reveal .25s ease}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;padding:1.25rem 0}.detail-item strong{display:block;margin-bottom:.28rem;color:var(--muted);font:700 .65rem Roboto,sans-serif;letter-spacing:.09rem;text-transform:uppercase}.detail-item,.detail-item a{color:var(--ink);font-size:.82rem;line-height:1.55;overflow-wrap:anywhere}.description-block{padding:1rem;border-radius:.7rem;background:#f7f4f1;white-space:pre-line}.description-block+.description-block{margin-top:.7rem}.image-gallery{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}.image-gallery a{display:block}.image-gallery img{width:6rem;height:6rem;object-fit:cover;border-radius:.55rem;border:1px solid var(--line);transition:.2s ease}.image-gallery img:hover{transform:scale(1.04)}.empty-state{padding:4rem 1rem;text-align:center;border:1px dashed #ccc3c7;border-radius:1rem;color:var(--muted);background:var(--paper)}.empty-state strong{display:block;margin-bottom:.5rem;font:900 2rem 'Big Shoulders',sans-serif;text-transform:uppercase;color:var(--ink)}
        .toast{position:fixed;right:1.2rem;bottom:1.2rem;z-index:20;max-width:20rem;padding:.9rem 1rem;border-radius:.7rem;background:var(--navy);color:#fff;box-shadow:0 .7rem 2rem rgba(20,63,128,.25);font-size:.82rem;transform:translateY(2rem);opacity:0;pointer-events:none;transition:.25s ease}.toast.is-visible{transform:none;opacity:1}.toast.is-error{background:#a53030}
        .loading{padding:3rem;text-align:center;color:var(--muted)}@keyframes reveal{from{opacity:0;transform:translateY(-.4rem)}to{opacity:1;transform:none}}
        @media(max-width:850px){.auth-shell{grid-template-columns:1fr}.auth-art{min-height:20rem}.stats-grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.search-wrap{grid-column:1/-1}.detail-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:560px){.dashboard-page{padding:.75rem}.dashboard-header{display:block}.header-actions{justify-content:flex-start;margin-top:1rem}.stats-grid{grid-template-columns:1fr 1fr;gap:.65rem}.toolbar{grid-template-columns:1fr}.search-wrap{grid-column:auto}.request-summary{grid-template-columns:minmax(0,1fr) auto}.summary-size{display:none}.detail-grid{grid-template-columns:1fr}.request-title{font-size:1.15rem}.auth-shell{border-radius:1rem}}
    </style>
</head>
<body class="is-ready"><main class="dashboard-page"><div class="admin-container">
    <section id="login-view" class="auth-shell"><div class="auth-art"><div class="auth-art-copy"><p class="eyebrow" style="color:#fff">Reveriel studio</p><h1>Create.<br>Connect.</h1><p>A private space for turning new ideas into finished work.</p></div></div><div class="auth-card"><p class="eyebrow">Private studio</p><h2>Commission portal</h2><p class="auth-copy">Sign in to review requests, organize the queue, and keep each project moving.</p><form id="login-form"><div class="form-group"><label class="form-label" for="login-email">Email</label><input type="email" id="login-email" class="form-input" autocomplete="username" required></div><div class="form-group"><label class="form-label" for="login-password">Password</label><input type="password" id="login-password" class="form-input" autocomplete="current-password" required></div><button type="submit" id="login-btn" class="btn primary">Enter studio →</button><div id="auth-error" role="alert"></div></form></div></section>
    <section id="dashboard-view">
        <header class="dashboard-header"><div><p class="eyebrow">Reveriel studio</p><h1>Commission desk</h1><p class="request-meta" id="last-updated">Your creative queue at a glance.</p></div><div class="header-actions"><button id="refresh-btn" class="btn" type="button">↻ Refresh</button><button id="logout-btn" class="btn" type="button">Log out</button></div></header>
        <div class="stats-grid" aria-label="Commission summary"><button class="stat-card stat-all is-selected" data-quick-filter="All"><span class="stat-label">All requests</span><span class="stat-value" id="stat-all">0</span></button><button class="stat-card stat-new" data-quick-filter="New"><span class="stat-label">New</span><span class="stat-value" id="stat-new">0</span></button><button class="stat-card stat-active" data-quick-filter="Active"><span class="stat-label">In the works</span><span class="stat-value" id="stat-active">0</span></button><button class="stat-card stat-completed" data-quick-filter="Completed"><span class="stat-label">Completed</span><span class="stat-value" id="stat-completed">0</span></button></div>
        <div class="toolbar"><label class="search-wrap"><input id="search-input" class="form-input" type="search" aria-label="Search requests" placeholder="Search client, medium, or idea…"></label><select id="status-filter" class="control-select" aria-label="Filter by status"><option value="All">All statuses</option><option>New</option><option value="Active">Accepted + in progress</option><option>Accepted</option><option>In Progress</option><option>Completed</option><option>Declined</option></select><select id="sort-select" class="control-select" aria-label="Sort requests"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="deadline">Deadline soonest</option></select></div>
        <p id="results-count" class="results-count" aria-live="polite"></p><div id="requests-list" class="requests-list"><div class="loading">Loading commissions…</div></div>
    </section>
</div></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
    const SUPABASE_URL='https://gvooqilvlqztifzpwaew.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2b29xaWx2bHF6dGlmenB3YWV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjc2NzIsImV4cCI6MjEwMzcwMzY3Mn0.GWoRsQPa1B0sQIGf-6trhf9WwdxvQREgz25puLbA9_o';
    const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const loginView=document.getElementById('login-view'),dashboardView=document.getElementById('dashboard-view'),loginForm=document.getElementById('login-form'),authError=document.getElementById('auth-error'),requestsList=document.getElementById('requests-list'),searchInput=document.getElementById('search-input'),statusFilter=document.getElementById('status-filter'),sortSelect=document.getElementById('sort-select');
    let allCommissions=[],toastTimer;
    const escapeHTML=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const safeURL=value=>{try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:'#'}catch{return '#'}};
    const formatDate=value=>value?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(new Date(value)):'None';
    function showToast(message,isError=false){const toast=document.getElementById('toast');toast.textContent=message;toast.className=`toast is-visible${isError?' is-error':''}`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.className='toast',2800)}
    async function initSession(){const{data:{session}}=await supabaseClient.auth.getSession();session?showDashboard():showLogin()}
    loginForm.addEventListener('submit',async event=>{event.preventDefault();authError.textContent='';const button=document.getElementById('login-btn');button.disabled=true;button.textContent='Signing in…';const{error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('login-email').value.trim(),password:document.getElementById('login-password').value});button.disabled=false;button.textContent='Enter studio →';if(error)authError.textContent=error.message;else showDashboard()});
    document.getElementById('logout-btn').addEventListener('click',async()=>{await supabaseClient.auth.signOut();showLogin()});
    document.getElementById('refresh-btn').addEventListener('click',()=>fetchCommissions(true));
    function showLogin(){loginView.style.display='grid';dashboardView.style.display='none'}
    function showDashboard(){loginView.style.display='none';dashboardView.style.display='block';fetchCommissions()}
    async function fetchCommissions(notify=false){const button=document.getElementById('refresh-btn');button.disabled=true;requestsList.innerHTML='<div class="loading">Refreshing your commission desk…</div>';const{data,error}=await supabaseClient.from('commissions').select('*').order('created_at',{ascending:false});button.disabled=false;if(error){requestsList.innerHTML=`<div class="empty-state"><strong>Couldn’t load requests</strong>${escapeHTML(error.message)}</div>`;return}allCommissions=data||[];updateStats();applyFilters();document.getElementById('last-updated').textContent=`Updated ${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`;if(notify)showToast('Commission desk refreshed')}
    function updateStats(){document.getElementById('stat-all').textContent=allCommissions.length;document.getElementById('stat-new').textContent=allCommissions.filter(i=>(i.status||'New')==='New').length;document.getElementById('stat-active').textContent=allCommissions.filter(i=>['Accepted','In Progress'].includes(i.status)).length;document.getElementById('stat-completed').textContent=allCommissions.filter(i=>i.status==='Completed').length}
    function applyFilters(){const query=searchInput.value.trim().toLowerCase(),status=statusFilter.value;let items=allCommissions.filter(item=>{const itemStatus=item.status||'New',matchesStatus=status==='All'||itemStatus===status||(status==='Active'&&['Accepted','In Progress'].includes(itemStatus));const haystack=[item.email,item.artwork_type,item.medium,item.size,item.description,item.style_preference].join(' ').toLowerCase();return matchesStatus&&(!query||haystack.includes(query))});items.sort((a,b)=>sortSelect.value==='oldest'?new Date(a.created_at)-new Date(b.created_at):sortSelect.value==='deadline'?(a.deadline?new Date(a.deadline):Infinity)-(b.deadline?new Date(b.deadline):Infinity):new Date(b.created_at)-new Date(a.created_at));renderRequests(items);document.getElementById('results-count').textContent=`Showing ${items.length} of ${allCommissions.length} request${allCommissions.length===1?'':'s'}`}
    function renderRequests(items){if(!items.length){requestsList.innerHTML='<div class="empty-state"><strong>No requests here</strong>Try another search or status filter.</div>';return}requestsList.innerHTML=items.map(item=>{const status=escapeHTML(item.status||'New'),id=escapeHTML(item.id),images=Array.isArray(item.reference_images)?item.reference_images:[];return `<article class="request-card" data-id="${id}"><button class="request-summary" type="button" aria-expanded="false"><div><div class="request-title">${escapeHTML(item.artwork_type||'Artwork')} commission</div><div class="request-meta">${escapeHTML(item.email)} · Submitted ${formatDate(item.created_at)}</div></div><span class="summary-size">${escapeHTML(item.size||'Size open')}</span><span class="chevron" aria-hidden="true">⌄</span></button><div class="request-body"><div class="detail-grid"><div class="detail-item"><strong>Status</strong><select class="status-select" data-status="${status}" aria-label="Update commission status"><option ${status==='New'?'selected':''}>New</option><option ${status==='Accepted'?'selected':''}>Accepted</option><option ${status==='In Progress'?'selected':''}>In Progress</option><option ${status==='Completed'?'selected':''}>Completed</option><option ${status==='Declined'?'selected':''}>Declined</option></select></div><div class="detail-item"><strong>Contact</strong><a href="mailto:${escapeHTML(item.email)}">${escapeHTML(item.email)}</a>${item.phone_number?`<br>${escapeHTML(item.phone_number)}`:''}</div><div class="detail-item"><strong>Medium</strong>${escapeHTML(item.medium||'Not specified')}</div><div class="detail-item"><strong>Dimensions</strong>${escapeHTML(item.size||'Not specified')}</div><div class="detail-item"><strong>Deadline</strong>${formatDate(item.deadline)} · ${escapeHTML(item.deadline_flexibility||'Not specified')}</div><div class="detail-item"><strong>Payment</strong>${escapeHTML(item.payment_method||'Not specified')}</div></div><div class="description-block detail-item"><strong>Creative brief</strong>${escapeHTML(item.description||'No description provided')}</div>${item.style_preference?`<div class="description-block detail-item"><strong>Style preference</strong>${escapeHTML(item.style_preference)}</div>`:''}${item.additional_comment?`<div class="description-block detail-item"><strong>Additional notes</strong>${escapeHTML(item.additional_comment)}</div>`:''}${images.length?`<div class="detail-item" style="margin-top:1rem"><strong>Reference images</strong><div class="image-gallery">${images.map(url=>`<a href="${safeURL(url)}" target="_blank" rel="noopener"><img src="${safeURL(url)}" alt="Commission reference image" loading="lazy"></a>`).join('')}</div></div>`:''}</div></article>`}).join('')}
    requestsList.addEventListener('click',event=>{if(event.target.closest('.status-select'))return;const summary=event.target.closest('.request-summary');if(!summary)return;const card=summary.closest('.request-card'),open=card.classList.toggle('is-open');summary.setAttribute('aria-expanded',String(open))});
    requestsList.addEventListener('change',async event=>{const select=event.target.closest('.status-select');if(!select)return;const card=select.closest('.request-card'),id=card.dataset.id,newStatus=select.value,previous=select.dataset.status;select.disabled=true;const{error}=await supabaseClient.from('commissions').update({status:newStatus}).eq('id',id);select.disabled=false;if(error){select.value=previous;showToast(`Couldn’t update status: ${error.message}`,true);return}select.dataset.status=newStatus;const record=allCommissions.find(item=>String(item.id)===id);if(record)record.status=newStatus;updateStats();applyFilters();showToast(`Status changed to ${newStatus}`)});
    [searchInput,statusFilter,sortSelect].forEach(control=>control.addEventListener(control===searchInput?'input':'change',applyFilters));
    document.querySelectorAll('[data-quick-filter]').forEach(card=>card.addEventListener('click',()=>{document.querySelectorAll('[data-quick-filter]').forEach(c=>c.classList.remove('is-selected'));card.classList.add('is-selected');statusFilter.value=card.dataset.quickFilter;applyFilters()}));
    statusFilter.addEventListener('change',()=>document.querySelectorAll('[data-quick-filter]').forEach(card=>card.classList.toggle('is-selected',card.dataset.quickFilter===statusFilter.value)));
    initSession();
</script></body></html>
