<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Portal - Reveriel</title>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link href="https://fonts.googleapis.com/css2?display=swap&amp;family=Big+Shoulders:ital,wght@0,700;0,900&amp;family=Roboto:ital,wght@0,400;0,700&amp;family=Open+Sans:ital,wght@0,300;0,400;0,600" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" href="style.css">

    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .admin-container {
            width: 100%;
            max-width: 55rem;
            margin: 0 auto;
            text-align: left;
        }

        .auth-card {
            max-width: 25rem;
            margin: 4rem auto;
            padding: 2rem;
            border: 1px solid #DBDBDB;
            border-radius: 0.625rem;
            background: #FFFFFF;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-family: 'Roboto', sans-serif;
            font-size: 0.8em;
            font-weight: 700;
            letter-spacing: 0.15rem;
            text-transform: uppercase;
            color: #5E5E5E;
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            font-family: 'Open Sans', sans-serif;
            font-size: 0.9em;
            border: 1px solid #DBDBDB;
            border-radius: 0.375rem;
            outline: none;
        }

        .form-input:focus {
            border-color: #54D6FF;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.2rem;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 0.15rem;
            font-size: 0.75em;
            font-weight: 700;
            border-radius: 0.375rem;
            color: #FF7070;
            background: transparent;
            border: solid 1px #DBDBDB;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }

        .btn-action:hover {
            border-color: #54D6FF;
            color: #54D6FF;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #DBDBDB;
        }

        .request-card {
            border: 1px solid #DBDBDB;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            background: #FFFFFF;
            font-family: 'Open Sans', sans-serif;
            color: #5E5E5E;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .request-title {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 1.1em;
            color: #5E5E5E;
        }

        .request-meta {
            font-size: 0.85em;
            color: #888888;
            margin-top: 0.2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            font-family: 'Roboto', sans-serif;
            font-size: 0.7em;
            font-weight: 700;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            border-radius: 0.25rem;
            background: #F2F2F2;
        }

        .grid-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
            font-size: 0.9em;
        }

        .detail-item strong {
            display: block;
            font-family: 'Roboto', sans-serif;
            font-size: 0.75em;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            color: #888888;
            margin-bottom: 0.2rem;
        }

        .image-gallery {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .image-gallery img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 0.25rem;
            border: 1px solid #DBDBDB;
        }

        .status-select {
            padding: 0.3rem 0.6rem;
            font-family: 'Roboto', sans-serif;
            font-size: 0.75em;
            border: 1px solid #DBDBDB;
            border-radius: 0.25rem;
            background: #FFFFFF;
            color: #5E5E5E;
            cursor: pointer;
        }

        #auth-error {
            color: #d32f2f;
            font-size: 0.85em;
            margin-top: 0.8rem;
            text-align: center;
        }
    </style>
</head>

<body class="is-ready">
<div class="site-wrapper">
    <div class="site-main">
        <div class="inner">
            <div class="admin-container">
                
                <!-- LOGIN FORM (Shown when unauthenticated) -->
                <div id="login-view" class="auth-card">
                    <h1 class="text-component instance-3" style="text-align: center; font-size: 1.8em; margin-bottom: 1rem;">Reveriel</h1>
                    <h2 class="text-component instance-9" style="text-align: center; margin-bottom: 1.5rem;"><strong>Commission Portal</strong></h2>
                    
                    <form id="login-form">
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="login-email" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" id="login-password" class="form-input" required>
                        </div>
                        <button type="submit" id="login-btn" class="btn-action" style="width: 100%;">Sign In</button>
                        <div id="auth-error"></div>
                    </form>
                </div>

                <!-- DASHBOARD VIEW (Shown when authenticated) -->
                <div id="dashboard-view" style="display: none;">
                    <div class="header-bar">
                        <div>
                            <h1 class="text-component instance-3" style="font-size: 1.8em;">Reveriel</h1>
                            <div class="request-meta">Commission Requests Management</div>
                        </div>
                        <button id="logout-btn" class="btn-action">Log Out</button>
                    </div>

                    <div id="requests-list">
                        <p style="font-family: 'Open Sans', sans-serif; color: #888;">Loading commissions...</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://gvooqilvlqztifzpwaew.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2b29xaWx2bHF6dGlmenB3YWV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjc2NzIsImV4cCI6MjEwMzcwMzY3Mn0.GWoRsQPa1B0sQIGf-6trhf9WwdxvQREgz25puLbA9_o';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginForm = document.getElementById('login-form');
    const authError = document.getElementById('auth-error');
    const requestsList = document.getElementById('requests-list');

    // Check existing authentication session on load
    async function initSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            showDashboard();
        } else {
            showLogin();
        }
    }

    // Login Handler
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        authError.textContent = '';
        
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        console.log("Attempting sign in for:", email);

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        
        if (error) {
            console.error("Supabase Auth Error:", error);
            authError.textContent = error.message;
        } else {
            console.log("Login successful:", data);
            showDashboard();
        }
    });

    // Logout Handler
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        showLogin();
    });

    function showLogin() {
        loginView.style.display = 'block';
        dashboardView.style.display = 'none';
    }

    function showDashboard() {
        loginView.style.display = 'none';
        dashboardView.style.display = 'block';
        fetchCommissions();
    }

    // Fetch and display requests
    async function fetchCommissions() {
        const { data: commissions, error } = await supabaseClient
            .from('commissions')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            requestsList.innerHTML = `<p style="color: #d32f2f;">Failed to load requests: ${error.message}</p>`;
            return;
        }

        if (!commissions || commissions.length === 0) {
            requestsList.innerHTML = '<p style="font-family: \'Open Sans\', sans-serif; color: #888;">No commission requests found.</p>';
            return;
        }

        requestsList.innerHTML = commissions.map(item => `
            <div class="request-card" id="card-${item.id}">
                <div class="request-header">
                    <div>
                        <div class="request-title">${item.artwork_type} Commission - ${item.size}</div>
                        <div class="request-meta">Submitted ${new Date(item.created_at).toLocaleDateString()}</div>
                    </div>
                    <div>
                        <select class="status-select" onchange="updateStatus('${item.id}', this.value)">
                            <option value="New" ${item.status === 'New' ? 'selected' : ''}>New</option>
                            <option value="Accepted" ${item.status === 'Accepted' ? 'selected' : ''}>Accepted</option>
                            <option value="In Progress" ${item.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                            <option value="Completed" ${item.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            <option value="Declined" ${item.status === 'Declined' ? 'selected' : ''}>Declined</option>
                        </select>
                    </div>
                </div>

                <div class="grid-details">
                    <div class="detail-item"><strong>Contact Email</strong><a href="mailto:${item.email}">${item.email}</a></div>
                    <div class="detail-item"><strong>Phone</strong>${item.phone_number || 'N/A'}</div>
                    <div class="detail-item"><strong>Medium</strong>${item.medium}</div>
                    <div class="detail-item"><strong>Payment Method</strong>${item.payment_method}</div>
                    <div class="detail-item"><strong>Deadline</strong>${item.deadline || 'None'} (${item.deadline_flexibility})</div>
                    <div class="detail-item"><strong>Style Preference</strong>${item.style_preference || 'N/A'}</div>
                </div>

                <div class="detail-item" style="margin-bottom: 0.8rem;">
                    <strong>Description</strong>
                    <div style="white-space: pre-line;">${item.description}</div>
                </div>

                ${item.additional_comment ? `
                    <div class="detail-item" style="margin-bottom: 0.8rem;">
                        <strong>Additional Comments</strong>
                        <div>${item.additional_comment}</div>
                    </div>
                ` : ''}

                ${item.reference_images && item.reference_images.length > 0 ? `
                    <div class="detail-item">
                        <strong>Reference Images</strong>
                        <div class="image-gallery">
                            ${item.reference_images.map(url => `<a href="${url}" target="_blank"><img src="${url}" alt="Reference"></a>`).join('')}
                        </div>
                    </div>
                ` : ''}
            </div>
        `).join('');
    }

    // Update status handler
    async function updateStatus(id, newStatus) {
        const { error } = await supabaseClient
            .from('commissions')
            .update({ status: newStatus })
            .eq('id', id);

        if (error) {
            alert(`Error updating status: ${error.message}`);
        }
    }

    initSession();
</script>
</body>
</html>
